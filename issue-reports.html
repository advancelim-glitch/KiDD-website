<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이슈리포트 | KiDD</title><meta name="description" content="한국숙의민주주의연구소의 현안 분석과 정책 제언"><style>body{font-family:system-ui,sans-serif;max-width:850px;margin:40px auto;padding:0 20px;line-height:1.8;color:#203047}a{color:#175e90}article{border-top:1px solid #ddd;padding:24px 0}small{color:#526175}</style></head><body><nav><a href="index.html">KiDD 홈페이지</a></nav><h1>이슈리포트</h1><p>KiDD Issue Report — 주요 사회적 쟁점과 공공정책을 숙의민주주의의 관점에서 분석하고 대안을 제시합니다.</p><article><small>No.1 | 2026.11.27.</small><h2>의제 설정부터 갈라선 원전 공론화, 일정보다 먼저 필요한 것은 ‘의제 설정에 대한 합의’입니다</h2><p>원전 공론화의 갈등은 의제 설정에서 시작됐습니다. 양측이 제기한 공정성 문제를 분석하고 의제 설정과 설문 문항·정보·참여 구조의 재점검을 제언합니다.</p></article></body></html>
