name: KiDD Joy AI group reply (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kidd-telegram-joy-getupdates
  cancel-in-progress: false

jobs:
  joy-ai-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Reply to one authorized group message
        run: python3 scripts/telegram_joy_ai_reply.py
