# blog.js가 바뀌면 KiDD Global 글별 페이지·피드·sitemap을 다시 만든다.
name: Build KiDD Global
on:
  push:
    branches: [main]
    paths: [blog.js, international/index.html, scripts/build-global.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-global.mjs
      - name: Commit generated files
        run: |
          git config user.name "KiDD build bot"
          git config user.email "actions@users.noreply.github.com"
          git add international/articles international/feed.xml sitemap.xml
          git diff --cached --quiet || (git commit -m "KiDD Global 정적 페이지 자동 갱신 (blog.js 변경)" && git push)
