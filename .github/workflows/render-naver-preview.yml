name: Render Naver blog preview from official logo
on:
  push:
    paths:
      - 'naver-blog-preview-v3.svg'
      - '.github/workflows/render-naver-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install cairosvg
      - name: Render final OG PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="naver-blog-preview-v3.svg",write_to="naver-blog-preview-v3.png",output_width=1200,output_height=630)
          PY
      - name: Commit generated binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naver-blog-preview-v3.png
          if ! git diff --cached --quiet; then
            git commit -m "Render verified Naver OG PNG from official KiDD logo"
            git push
          fi
