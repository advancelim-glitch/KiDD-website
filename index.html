<style>
  :root {

  * { box-sizing: border-box; }

  body { margin: 0; font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  a { color: var(--navy); }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--navy2); outline-offset: 2px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 22px; }
  .tmp { background: #fff3c4; padding: 0 4px; border-radius: 3px; }

  /* header */
  header { border-bottom: 1px solid var(--line); background: #fff; position: sticky; top: 0; z-index: 10; }
  .wrap.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding-top: 12px; padding-bottom: 12px; }

  main.wrap { padding-top: 36px; padding-bottom: 72px; min-height: 60vh; }
  h1 { font-size: 30px; line-height: 1.4; margin: 0 0 12px; letter-spacing: -0.02em; }
  h2 { font-size: 22px; line-height: 1.45; margin: 44px 0 14px; letter-spacing: -0.01em; }

  /* hero */
  .hero { text-align: center; background: radial-gradient(ellipse at 50% 30%, #ffffff 0%, #f6f4f8 60%, #efedf4 100%); border-radius: 16px; padding: 48px 24px 44px; }
  .hero .flower { width: 168px; height: 168px; display: block; margin: 0 auto 26px; }
  .hero .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .22em; color: var(--rose); margin: 0 auto 14px; max-width: none; }
  .hero h1 { font-size: 36px; line-height: 1.35; margin: 0 0 18px; color: var(--navy); }

  .cta { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; font-weight: 600; font-size: 16px; text-decoration: none; border: 1.5px solid var(--navy); }
  .cta.fill { background: var(--navy); color: #fff; }
  .cta.line { background: #fff; color: var(--navy); }

  /* areas */
  .areas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .areas a { display: flex; gap: 14px; height: 100%; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .areas a:hover { border-color: var(--navy2); background: var(--soft); }
  .petal { flex: none; width: 18px; height: 18px; border-radius: 50%; margin-top: 8px; opacity: .8; }

  .board .t { font-weight: 600; font-size: 17.5px; }
  .board .d { font-size: 14px; color: var(--muted); white-space: nowrap; align-self: center; }
  .board .m { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
  .tag { display: inline-block; font-size: 13px; font-weight: 600; color: var(--navy); background: var(--sky); border-radius: 4px; padding: 0 7px; margin-right: 6px; }
  .empty { color: var(--muted); padding: 22px 4px; margin: 0; border-bottom: 1px solid var(--line); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .filters a { text-decoration: none; font-size: 15px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  .filters a[aria-current="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* article */
  .meta { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
  .abstract { background: var(--soft); border-radius: 10px; padding: 18px 20px; margin: 0 0 26px; }
  .abstract strong { display: block; font-size: 15px; color: var(--navy); margin-bottom: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 8px; }
  .btn { font: inherit; font-size: 16px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 10px 16px; border-radius: 8px; min-height: 44px; text-decoration: none; display: inline-flex; align-items: center; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn[aria-disabled="true"] { color: #9aa0a8; cursor: default; }
  .cite { border-left: 3px solid var(--navy); padding: 4px 0 4px 14px; font-size: 15.5px; color: var(--muted); margin: 18px 0; }

  .quote { font-size: 20px; font-weight: 600; color: var(--navy); line-height: 1.7; margin: 32px 0 16px; padding-top: 22px; border-top: 1px solid var(--line); }
  .principle { border-left: 3px solid var(--navy); padding: 2px 0 2px 18px; }
  .principle p { margin: 0 0 8px; }
  .logo-story { display: flex; gap: 20px; align-items: center; background: var(--soft); border-radius: 12px; padding: 20px; }
  .logo-story img { width: 96px; height: 96px; flex: none; }
  .logo-story p { margin: 0; font-size: 16.5px; }

  /* contact */
  .mailbox { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--soft); border-radius: 12px; padding: 18px 20px; margin-bottom: 26px; }
  .mailbox .addr { font-size: 20px; font-weight: 700; color: var(--navy); }
  form label { display: block; font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
  form input, form textarea { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border: 1px solid #cdd3da; border-radius: 8px; }
  form textarea { min-height: 160px; resize: vertical; }
  form .btn { margin-top: 16px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.on { opacity: 1; }

  footer { border-top: 1px solid var(--line); background: var(--soft); padding: 28px 0 40px; font-size: 14px; color: var(--muted); line-height: 1.7; }
  footer .wrap { display: flex; gap: 14px; align-items: flex-start; }
  footer img { width: 34px; height: 34px; flex: none; }
  footer p { margin: 0 0 6px; }

  @media (max-width: 640px) {
    body { font-size: 17px; }
    h1 { font-size: 25px; }
    .brand small { display: none; }
    .brand img { width: 34px; height: 34px; }
    .brand b { font-size: 17px; }
    nav a { padding: 5px 8px; font-size: 15.5px; }
    .hero { padding: 36px 18px 34px; }
    .hero .flower { width: 132px; height: 132px; }
    .hero h1 { font-size: 28px; }
    .hero .eyebrow { font-size: 12.5px; letter-spacing: .16em; }
    .hero p { font-size: 16.5px; }
    .cta { width: 100%; justify-content: center; }
    .areas { grid-template-columns: 1fr; }
    .board a { grid-template-columns: 1fr; }
    .board .d { align-self: start; }
    .logo-story { flex-direction: column; text-align: center; }
  }
</style>

<script>
const SITE = "한국숙의민주주의연구소";
const AREAS = [
  { id: "systems", name: "숙의체계", en: "Deliberative Systems", color: "#b4475c",
    q: "개별 토론장을 넘어, 언론·정당·의회·시민사회로 이루어진 체계 전체의 숙의 질을 어떻게 평가할 것인가." },
  { id: "facilitation", name: "퍼실리테이션", en: "Facilitation", color: "#93506f",
    q: "진행자의 개입은 참여자의 의견 형성에 어떤 영향을 주며, 양극화된 의제에서 공정한 진행이란 무엇인가." },
  { id: "ai", name: "AI 활용 숙의", en: "AI-assisted Deliberation", color: "#6f5784",
    q: "AI는 숙의를 넓히는가, 대체하는가. 중재·요약을 AI에 맡길 때 누구의 관점이 지워지는가." },
  { id: "institution", name: "제도화", en: "Institutionalisation", color: "#4c5795",
    q: "일회성 공론화를 상설 제도로 만들려면 법적 근거, 권한, 정치적 수용을 어떻게 갖춰야 하는가." },
  { id: "other", name: "기타", en: "Other Topics", color: "#2f4f93",
    q: "네 분야 밖의 숙의민주주의 관련 글, 서평, 해외 동향과 현장 기록을 싣습니다." }
];

const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const areaOf = id => AREAS.find(a => a.id === id);
const base = () => location.href.split("#")[0];
const byDate = (a, b) => String(b.date).localeCompare(String(a.date));
const posts = (typeof POSTS !== "undefined" ? POSTS : []).slice().sort(byDate);
const notices = (typeof NOTICES !== "undefined" ? NOTICES : []).slice().sort(byDate);
const mail = (typeof CONTACT_EMAIL !== "undefined" ? CONTACT_EMAIL : "").trim();

function postList(list, showArea = true) {
  if (!list.length) return '<p class="empty">아직 올라온 글이 없습니다.</p>';
  return '<ul class="board">' + list.map(p => {
    const a = areaOf(p.area);
    return `<li><a href="#post-${esc(p.id)}"><span class="t">${p.type ? `<span class="tag">${esc(p.type)}</span>` : ""}${esc(p.title)}</span>
      <span class="d">${esc(p.date)}</span>
      <span class="m">${showArea && a ? esc(a.name) + " · " : ""}${esc(p.author)}</span></a></li>`;
  }).join("") + "</ul>";
}
function noticeList(list) {
  if (!list.length) return '<p class="empty">등록된 공지가 없습니다.</p>';
  return '<ul class="board">' + list.map(n =>
    `<li><a href="#notice-${esc(n.id)}"><span class="t">${esc(n.title)}</span><span class="d">${esc(n.date)}</span></a></li>`
  ).join("") + "</ul>";
}
function areaCards() {
  return '<ul class="areas">' + AREAS.map(a => {
    const n = posts.filter(p => p.area === a.id).length;
    return `<li><a href="#area-${a.id}"><span class="petal" style="background:${a.color}"></span>
      <span><h3>${a.name}<span class="en">${a.en}</span></h3><p>${a.q}</p><span class="cnt">글 ${n}편 →</span></span></a></li>`;
  }).join("") + "</ul>";
}

const pages = {
  home: () => `
    <section class="hero">
      <img class="flower" src="logo.svg" alt="숙의의 꽃 로고">
      <p class="eyebrow">KIDD · DELIBERATIVE DEMOCRACY</p>
      <h1>숙의의 꽃,<br><span>차이에서 피어나는 희망</span></h1>
      <p>서로 다른 생각이 만나 공동의 지혜를 이루고,<br>민주주의의 새로운 미래를 열어갑니다.<br>독립적인 연구와 열린 협력으로 시민숙의의 가능성을 넓힙니다.</p>
      <div class="ctas"><a class="cta fill" href="#about">연구소 소개 보기 ↗</a><a class="cta line" href="#research">연구 · 활동 살펴보기 →</a></div>
    </section>
    <div class="sec-head"><h2>연구 분야</h2><a href="#research">전체 글 →</a></div>
    ${areaCards()}
    <div class="sec-head"><h2>최근 글</h2><a href="#research">더 보기 →</a></div>
    ${postList(posts.slice(0, 5))}
    <div class="sec-head"><h2>공지사항</h2><a href="#notice">더 보기 →</a></div>
    ${noticeList(notices.slice(0, 3))}
    <p class="quote">민주주의의 미래는 누가 이기느냐에만 달려 있지 않다.<br>서로 다른 사람들이 어떻게 함께 살아갈 것인가에 달려 있다.</p>
    <p><a href="#about">설립취지문 전문 보기 →</a></p>
  `,
  about: () => `
    <h1>연구소 소개</h1>
    <div class="logo-story">
      <img src="logo.svg" alt="숙의의 꽃 로고">
      <p><strong>숙의의 꽃.</strong> 빨강과 파랑의 꽃잎이 서로 겹치며 새로운 빛깔을 만들고, 그 한가운데에 흰 별이 뜹니다. 서로 다른 생각이 만나는 자리에서 공동의 지혜가 피어난다는 뜻을 담았습니다.</p>
    </div>
    <h2>설립취지문</h2>
      <p>민주주의는 서로 다른 생각을 가진 사람들이 함께 살아가기 위한 정치적 지혜이자 제도이다. 민주주의의 힘은 차이를 없애는 데 있지 않다. 다양한 견해와 이해관계가 자유롭게 표현되고, 대화와 숙의를 통해 공동의 문제를 해결해 나가는 데 있다.</p>
      <p>오늘날 한국 민주주의는 새로운 과제에 직면해 있다. 선거와 정당을 중심으로 작동하는 대의민주주의는 민주적 정당성의 핵심 기반이지만, 복잡해지는 사회적 갈등과 다양한 시민의 요구를 충분히 수렴하는 데 한계를 드러내고 있다. 정치적 양극화와 진영 간 대립은 공적 토론의 공간을 좁히고, 상대방을 설득과 협력의 대상이 아니라 극복해야 할 대상으로 여기게 만들고 있다.</p>
      <p>우리는 이러한 문제를 해결하기 위해 민주주의를 부정하거나 대의민주주의를 대체하려는 것이 아니다. 오히려 대의민주주의의 토대 위에서 시민의 참여와 숙의를 확대함으로써 민주주의의 역량을 높이고자 한다.</p>
      <p>숙의민주주의는 단순히 더 많은 사람이 의견을 표명하는 것을 넘어, 서로 다른 시민들이 충분한 정보를 바탕으로 경청하고 질문하며 자신의 판단을 성찰하고 발전시키는 민주주의의 과정이다. 그 과정에서 차이는 존중되고, 주장은 검증되며, 공적 판단은 더욱 깊어질 수 있다.</p>
      <p>우리는 숙의가 반드시 합의에 도달해야 한다고 생각하지 않는다. 합의에 이르지 못하더라도 쟁점과 이견을 명확히 이해하고, 서로의 견해를 존중하며, 공존의 가능성을 넓히는 것 역시 숙의의 중요한 성과이다.</p>
      <p>한국숙의민주주의연구소는 이러한 문제의식과 지향을 바탕으로 설립되는 독립적인 연구·실천 기관이다.</p>
      <p>연구소는 특정 정치세력이나 이념적 진영의 입장을 대변하지 않는다. 진보와 보수, 다수와 소수라는 구분을 넘어 민주주의의 보편적 가치와 합리적 공론의 원칙을 추구한다. 연구와 운영의 독립성을 유지하면서 다양한 학계, 시민사회, 공공기관 및 국제 연구기관과 개방적으로 연대하고 협력할 것이다.</p>
      <p>연구소는 다음과 같은 과제를 실천하고자 한다.</p>
      <ol class="tasks">
        <li>숙의민주주의의 이론과 국내외 경험을 체계적으로 연구하고, 한국 사회의 정치·사회·문화적 조건에 적합한 시민숙의 모델을 개발한다.</li>
        <li>시민의회와 시민참여단 등 대표성 있는 숙의기구의 설계, 숙의 과정의 공정성과 질적 수준, 숙의 결과의 정책적 연계 및 제도화 방안을 연구한다.</li>
        <li>숙의 진행자와 기획자 등 전문인력을 양성하고, 공공기관과 시민사회의 숙의 역량을 높이기 위한 교육과 실천 활동을 수행한다.</li>
        <li>지역사회와 국가적 현안에 관한 시민숙의 및 사회적 대화를 촉진하고, 다양한 갈등을 민주적으로 다루는 공론의 문화를 확산한다.</li>
        <li>디지털 기술과 인공지능이 시민의 숙의와 공적 판단에 미치는 영향을 연구하고, 새로운 기술이 민주적 참여와 집단적 지혜의 발전에 기여할 수 있는 방안을 모색한다.</li>
        <li>국내외 연구자와 실천가, 시민사회 및 공공기관과 교류하고 협력하며, 숙의민주주의의 성과와 경험을 축적하고 공유한다.</li>
      </ol>
      <p>우리는 숙의민주주의를 모든 갈등을 해결하는 만능의 제도로 생각하지 않는다. 숙의에도 한계가 있으며, 참여의 대표성, 정보의 균형, 권력의 불평등, 숙의 결과의 실효성 등 끊임없이 검증하고 개선해야 할 과제가 존재한다. 따라서 연구소는 숙의민주주의 자체에 대해서도 비판적이고 성찰적인 연구 태도를 견지할 것이다.</p>
      <p>민주주의는 완성된 제도가 아니라 시민들이 끊임없이 배우고 발전시켜 나가는 공동의 실천이다.</p>
      <p>우리는 서로 다른 생각을 가진 시민들이 적대의 대상이 아니라 함께 공적 문제를 해결하는 동료가 될 수 있다고 믿는다.</p>
      <p>한국숙의민주주의연구소는 그 가능성을 학문적으로 탐구하고, 현실 속에서 실험하며, 제도와 문화로 정착시키는 데 기여하고자 한다.</p>
      <p class="quote">민주주의의 미래는 누가 이기느냐에만 달려 있지 않다. 서로 다른 사람들이 어떻게 함께 살아갈 것인가에 달려 있다.<br>한국숙의민주주의연구소는 그 질문에서 출발한다.</p>
    <h2>연구 원칙</h2>
    <div class="principle">
      <p><strong>원문 근거.</strong> 1차 자료에 근거하고, 해외 개념은 원어를 함께 적으며 번역은 원문과 대조합니다.</p>
      <p><strong>사실과 해석의 구분.</strong> 확인된 사실과 연구자의 해석을 나누어 씁니다.</p>
      <p><strong>공정한 검토.</strong> 진영이 아니라 논거로 판단하고, 서로 다른 관점을 공정하게 다룹니다.</p>
      <p><strong>정정의 공개.</strong> 오류가 확인되면 원문을 보존하고 정정 내용을 글 아래에 밝힙니다.</p>
    </div>
  `,
  research: () => {
    return `
    <h1>연구</h1>
    <p class="lead">네 분야는 체계 → 진행 → 기술 → 제도로 이어지는 하나의 연구 흐름이며, 그 밖의 글은 '기타'에 싣습니다.</p>
    ${areaCards()}
    <h2>전체 글</h2>
    ${postList(posts)}`;
  },
  notice: () => `
    <h1>공지사항</h1>
    <p class="lead">연구소 소식, 발표와 행사 안내를 알려 드립니다.</p>
    ${noticeList(notices)}`,
  contact: () => `
    <h1>문의</h1>
    <p class="lead">연구 협력, 강연·자문 요청, 글에 대한 의견은 이메일로 보내 주십시오.</p>
    <div class="mailbox">
      ${mail
        ? `<span class="addr">${esc(mail)}</span><button class="btn" data-act="copymail">주소 복사</button>`
        : `<span class="addr"><span class="tmp">이메일 주소 확정 후 기재</span></span>`}
    </div>
    <h2>메일 바로 쓰기</h2>
    <p class="note">아래 내용을 채우고 '메일 앱으로 보내기'를 누르면 휴대전화나 PC의 메일 앱이 열리고 내용이 채워집니다. 이 사이트는 입력하신 내용을 따로 저장하지 않습니다.</p>
    <form id="mailform" novalidate>
      <label for="f-name">이름</label><input id="f-name" autocomplete="name">
      <label for="f-org">소속 (선택)</label><input id="f-org" autocomplete="organization">
      <label for="f-subj">제목</label><input id="f-subj">
      <label for="f-body">내용</label><textarea id="f-body"></textarea>
      <button class="btn primary" type="submit">메일 앱으로 보내기</button>
    </form>`
};

function areaPage(id) {
  const a = areaOf(id); if (!a) return null;
  return `<a class="back" href="#research">← 연구</a>
    <h1>${a.name}</h1>
    <p class="lead">${a.q}</p>
    <div class="filters">${AREAS.map(x => `<a href="#area-${x.id}" ${x.id === id ? 'aria-current="true"' : ""}>${x.name}</a>`).join("")}</div>
    ${postList(posts.filter(p => p.area === id), false)}`;
}
function citation(p) {
  return `${p.author}(${String(p.date).slice(0, 4)}). 「${p.title}」. ${SITE}. ${base()}#post-${p.id}`;
}
function shareBtns(kind, id) {
  return `<button class="btn primary" data-act="share" data-kind="${kind}" data-id="${esc(id)}">공유하기</button>
    <button class="btn" data-act="link" data-kind="${kind}" data-id="${esc(id)}">링크 복사</button>`;
}
function postPage(id) {
  const p = posts.find(x => x.id === id); if (!p) return null;
  const a = areaOf(p.area);
  const pdf = p.pdf ? `<a class="btn" href="${esc(p.pdf)}" download>PDF 내려받기</a>` : "";
  return `<a class="back" href="#area-${esc(p.area)}">← ${esc(a ? a.name : "연구")}</a>
    <p class="meta">${p.type ? `<span class="tag">${esc(p.type)}</span>` : ""}${esc(a ? a.name : "")}</p>
    <h1>${esc(p.title)}</h1>
    <p class="meta">${esc(p.author)} · ${esc(p.date)}</p>
    ${p.summary ? `<div class="abstract"><strong>요약</strong>${esc(p.summary)}</div>` : ""}
    ${(p.body || []).map(t => `<p>${esc(t)}</p>`).join("")}
    <div class="actions">${shareBtns("post", p.id)}
      <button class="btn" data-act="cite" data-id="${esc(p.id)}">인용 문구 복사</button>${pdf}</div>
    <p class="cite">${esc(citation(p))}</p>
    <p class="note">출처를 밝히면 자유롭게 퍼가실 수 있습니다.</p>`;
}
function noticePage(id) {
  const n = notices.find(x => x.id === id); if (!n) return null;
  return `<a class="back" href="#notice">← 공지사항</a>
    <h1>${esc(n.title)}</h1>
    <p class="meta">${esc(n.date)}</p>
    ${(n.body || []).map(t => `<p>${esc(t)}</p>`).join("")}
    <div class="actions">${shareBtns("notice", n.id)}</div>`;
}

function render() {
  const h = (location.hash || "#home").slice(1);
  let html = null, nav = h, title = SITE;
  if (pages[h]) html = pages[h]();
  else if (h.startsWith("area-")) { html = areaPage(h.slice(5)); nav = "research"; }
  else if (h.startsWith("post-")) { html = postPage(h.slice(5)); nav = "research"; const p = posts.find(x => x.id === h.slice(5)); if (p) title = `${p.title} | ${SITE}`; }
  else if (h.startsWith("notice-")) { html = noticePage(h.slice(7)); nav = "notice"; }
  if (!html) { html = pages.home(); nav = "home"; }
  view.innerHTML = html;
  document.title = title;
  document.querySelectorAll("nav a").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}

const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2000); };
async function copy(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch { toast("복사가 막혀 있습니다. 직접 선택해 복사해 주세요."); }
}

view.addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "copymail") return copy(mail, "이메일 주소를 복사했습니다.");
  const isNotice = b.dataset.kind === "notice";
  const item = (isNotice ? notices : posts).find(x => x.id === b.dataset.id); if (!item) return;
  const url = `${base()}#${isNotice ? "notice" : "post"}-${item.id}`;
  if (act === "share") {
    if (navigator.share) { try { await navigator.share({ title: item.title, text: item.summary || item.title, url }); return; } catch (err) { if (err && err.name === "AbortError") return; } }
    return copy(url, "링크를 복사했습니다. 원하는 곳에 붙여 넣어 주세요.");
  }
  if (act === "link") return copy(url, "링크를 복사했습니다.");
  if (act === "cite") return copy(citation(item), "인용 문구를 복사했습니다.");
});

view.addEventListener("submit", e => {
  if (e.target.id !== "mailform") return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  if (!mail) return toast("문의 이메일 주소가 아직 등록되지 않았습니다.");
  if (!v("f-subj") || !v("f-body")) return toast("제목과 내용을 입력해 주세요.");
  const body = `${v("f-body")}\n\n— ${v("f-name")}${v("f-org") ? " (" + v("f-org") + ")" : ""}`;
  location.href = `mailto:${mail}?subject=${encodeURIComponent("[홈페이지 문의] " + v("f-subj"))}&body=${encodeURIComponent(body)}`;
});

document.getElementById("foot-mail").innerHTML = mail
  ? `문의: <a href="mailto:${esc(mail)}">${esc(mail)}</a>`
  : `문의: <span class="tmp">이메일 주소 확정 후 기재</span>`;

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
